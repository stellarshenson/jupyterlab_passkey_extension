[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.0.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_passkey_extension"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.4.0,<3",
    # The jupyterlab-passkey CLI posts its trigger to this extension's ingest endpoint
    # to raise the notification button that supplies WebAuthn's user gesture. The
    # console script ships unconditionally, so this is a hard requirement, not an
    # extra - without it the very first command dies with a 404.
    "jupyterlab_notifications_extension>=1.2",
    # The `render` endpoint draws a staged code to a distorted PNG the `show` command
    # displays, so the code never reaches the page as text. Pillow >= 10.1 provides
    # ImageFont.load_default(size=...), so no font file has to ship with the package.
    "Pillow>=10.1",
    # The vault: AES-256-GCM for the entries and the wrapped data key, Scrypt for the
    # recovery slot, HKDF for a passkey slot's PRF.
    "cryptography>=42"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.scripts]
jupyterlab-passkey = "jupyterlab_passkey_extension.cli:main"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.0.0",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0",
    # The Galata test server: ui-tests/jupyter_server_test_config.py imports jupyterlab.galata
    "jupyterlab>=4.6,<5"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_passkey_extension/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_passkey_extension/labextension" = "share/jupyter/labextensions/jupyterlab_passkey_extension"
"install.json" = "share/jupyter/labextensions/jupyterlab_passkey_extension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyterlab_passkey_extension/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_passkey_extension/labextension/static/style.js",
    "jupyterlab_passkey_extension/labextension/package.json",
]
skip-if-exists = ["jupyterlab_passkey_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_passkey_extension/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.0.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
